[package]
name = "webability-rust"
version = "0.1.1"
edition = "2021"
license = "MIT"
description = "Cliente oficial en Rust para la API pública de WebAbility (https://api.webability.info)."
homepage = "https://github.com/webability/webability-rust"
repository = "https://github.com/webability/webability-rust"
authors = ["Philippe Thomassigny"]
keywords = ["webability", "api", "dns", "mail"]

[dependencies]
ureq = "2"
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
